
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Affichage trains</title>

<style>
/* =================================
   GRAPHICS CONFIGURATION
================================= */

:root {
    --background: #101c42;
    --panel: #1d315e;
    --red: #c72727;
    --white: #f5f7fa;
    --yellow: #ffdf55;

    --width: 320px;
    --height: 480px;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    background: var(--background);
    font-family: "Segoe UI", Arial, sans-serif;
    color: var(--white);
}

.screen {
    width: var(--width);
    height: var(--height);
    overflow: hidden;
    background: var(--background);
    padding: 10px;
}

/* =================================
   HEADER
================================= */

.header {
    height: 75px;
    background: var(--red);
    border-radius: 10px 0 0 0;

    display: flex;
    align-items: center;
    padding: 10px;
    gap: 30px;
}

.logo {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: #e9f5f5;
    color: #bd3939;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 27px;
    font-weight: bold;
}

.station {
    font-size: 22px;
    font-weight: bold;
    white-space: nowrap;
}

/* =================================
   CLOCK
================================= */

.clock-panel {
    height: 80px;
    margin-top: 10px;
    border-radius: 18px;
    background: var(--panel);

    display: flex;
    align-items: center;
    justify-content: center;
}

.clock {
    font-size: 52px;
    font-weight: 800;
    color: var(--red);
    letter-spacing: -2px;
    font-variant-numeric: tabular-nums;
}

/* =================================
   TRAIN TABLE
================================= */

.train-panel {
    margin-top: 12px;
    background: var(--panel);
    border-radius: 15px;
    overflow: hidden;
}

.row {
    height: 50px;
    display: grid;
    grid-template-columns: 35px 70px 1fr 40px;
    align-items: center;
    padding: 0 8px;
    border-bottom: 1px solid rgba(255,255,255,0.09);
}

.row:last-child {
    border-bottom: none;
}

.time {
    font-size: 22px;
    font-weight: 800;
    text-align: center;
}

.delay {
    font-size: 13px;
    color: var(--yellow);
    white-space: nowrap;
}

.destination {
    font-size: 15px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.hour {
    font-size: 17px;
    font-weight: bold;
    text-align: right;
    white-space: nowrap;
}

.warning {
    font-size: 17px;
    margin-right: 3px;
}

</style>
</head>

<body>

<div class="screen">

    <!-- HEADER -->
    <div class="header">
        <div class="logo" id="logo"><!-- DISPLAY_LOGO --></div>
        <div class="station" id="station"><!-- DISPLAY_STATION --></div>
    </div>

    <!-- CLOCK -->
    <div class="clock-panel">
        <div class="clock" id="clock"><!-- DISPLAY_CLOCK --></div>
    </div>

    <!-- TABLE -->
    <div class="train-panel" id="table"><!-- DISPLAY_TRAINS --></div>

</div>

</body>
</html>
