
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Affichage trains</title>

<style>
/* =================================
   GRAPHICS CONFIGURATION
================================= */

:root {
    --background: #101c42;
    --panel: #1d315e;
    --red: #c72727;
    --white: #f5f7fa;
    --yellow: #ffdf55;

    --width: 320px;
    --height: 480px;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    background: var(--background);
    font-family: "Segoe UI", Arial, sans-serif;
    color: var(--white);
}

.screen {
    width: var(--width);
    height: var(--height);
    overflow: hidden;
    background: var(--background);
    padding: 10px;
}

/* =================================
   HEADER
================================= */

.header {
    height: 75px;
    background: var(--red);
    border-radius: 10px 0 0 0;

    display: flex;
    align-items: center;
    padding: 10px;
    gap: 30px;
}

.logo {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: #e9f5f5;
    color: #bd3939;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 27px;
    font-weight: bold;
}

.station {
    font-size: 22px;
    font-weight: bold;
    white-space: nowrap;
}

/* =================================
   CLOCK
================================= */

.clock-panel {
    height: 80px;
    margin-top: 10px;
    border-radius: 18px;
    background: var(--panel);

    display: flex;
    align-items: center;
    justify-content: center;
}

.clock {
    font-size: 52px;
    font-weight: 800;
    color: var(--red);
    letter-spacing: -2px;
    font-variant-numeric: tabular-nums;
}

/* =================================
   TRAIN TABLE
================================= */

.train-panel {
    margin-top: 12px;
    background: var(--panel);
    border-radius: 15px;
    overflow: hidden;
}

.row {
    height: 50px;
    display: grid;
    grid-template-columns: 35px 70px 1fr 40px;
    align-items: center;
    padding: 0 8px;
    border-bottom: 1px solid rgba(255,255,255,0.09);
}

.row:last-child {
    border-bottom: none;
}

.time {
    font-size: 22px;
    font-weight: 800;
    text-align: center;
}

.delay {
    font-size: 13px;
    color: var(--yellow);
    white-space: nowrap;
}

.destination {
    font-size: 15px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.hour {
    font-size: 17px;
    font-weight: bold;
    text-align: right;
    white-space: nowrap;
}

.warning {
    font-size: 17px;
    margin-right: 3px;
}

</style>
</head>

<body>

<div class="screen">

    <!-- HEADER -->
    <div class="header">
        <div class="logo" id="logo"></div>
        <div class="station" id="station"></div>
    </div>

    <!-- CLOCK -->
    <div class="clock-panel">
        <div class="clock" id="clock">00:00:00</div>
    </div>

    <!-- TABLE -->
    <div class="train-panel" id="table"></div>

</div>


<script>

/* ==========================================
   VARIABLES
========================================== */

const station = {nom: "Maisons-Laffitte", logo: "A"};
const clock = "22:15:24"
const trains = [
    {time: "3", hour: "14:05", destination: "Boissy", delay: ""},
    {time: "6", hour: "14:12", destination: "Marne-la-Vallée", delay: "⚠️ 2min"},
    {time: "10", hour: "14:20", destination: "Boissy", delay: ""},
    {time: "16", hour: "14:29", destination: "Boissy", delay: ""},
    {time: "25", hour: "14:37", destination: "Marne-la-Vallée", delay: ""},
    {time: "28", hour: "14:47", destination: "Marne-la-Vallée", delay: ""}
];


/* ==========================================
   HEADER DISPLAY
========================================== */

document.getElementById("station").textContent = station.nom;
document.getElementById("logo").textContent = station.logo;


/* ==========================================
   DATA INSERTION
========================================== */

function buildTable() {

    const table = document.getElementById("table");
    table.innerHTML = trains.map(t => `
        <div class="row">
            <span class="time">${t.time}</span>
            <span class="delay">${t.delay}</span>
            <span class="destination">${t.destination}</span>
            <span class="hour">${t.hour}</span>
        </div>
    `).join("");

}

function buildClock() {
    const clockElement = document.getElementById("clock");
    clockElement.textContent = clock;
}


// INFO: call data build
buildTable();
buildClock();

</script>

</body>
</html>
