
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Affichage trains</title>

<style>
/* =================================
   GRAPHICS CONFIGURATION
================================= */

:root {
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    background: #101c42;
    font-family: Arial, Helvetica, sans-serif;
    color: #f5f7fa;
}

.screen {
    width: 320px;
    height: 480px;
    overflow: hidden;
    background: #101c42;
    padding: 10px;
}

/* =================================
   HEADER
================================= */

.header {
    height: 75px;
    background: #c72727;
    border-radius: 10px 0 0 0;
    display: table;
    table-layout: fixed;
    width: 100%;
    padding: 0;
}

.logo-cell,
.station {
    display: table-cell;
    vertical-align: middle;
}

.logo-cell {
    width: 65px;
    padding-left: 10px;
}

.logo {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: #e9f5f5;
    color: #bd3939;

    line-height: 45px;
    text-align: center;
    font-size: 27px;
    font-weight: bold;
}

.station {
    font-size: 22px;
    font-weight: bold;
    white-space: nowrap;
    padding-left: 10px;
}

/* =================================
   CLOCK
================================= */

.clock-panel {
    height: 80px;
    margin-top: 10px;
    border-radius: 18px;
    background: #1d315e;
    text-align: center;
    line-height: 80px;
}

.clock {
    display: inline-block;
    vertical-align: middle;
    line-height: normal;
    font-size: 52px;
    font-weight: 800;
    color: #c72727;
    letter-spacing: -2px;
    font-variant-numeric: tabular-nums;
}

/* =================================
   TRAIN TABLE
================================= */

.train-panel {
    width: 100%;
    margin-top: 12px;
    background: #1d315e;
    border-radius: 15px;
    overflow: hidden;
}

.train-table {
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
}

.row {
    height: 50px;
}

.row td {
    height: 50px;
    padding: 0 4px;
    vertical-align: middle;
    border-bottom: 1px solid rgba(255,255,255,0.09);
    overflow: hidden;
}

.row:last-child td {
    border-bottom: none;
}

.time {
    width: 35px;
    font-size: 22px;
    font-weight: 800;
    text-align: center;
    white-space: nowrap;
}

.delay {
    font-size: 13px;
    color: #ffdf55;
    white-space: nowrap;
}

.destination {
    font-size: 15px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.hour {
    width: 55px;
    font-size: 17px;
    font-weight: bold;
    text-align: right;
    white-space: nowrap;
}

.warning {
    font-size: 17px;
    margin-right: 3px;
}

</style>
</head>

<body>

<div class="screen">

    <!-- HEADER -->
    <div class="header">
        <div class="logo-cell"><div class="logo" id="logo"><!-- DISPLAY_LOGO --></div></div>
        <div class="station" id="station"><!-- DISPLAY_STATION --></div>
    </div>

    <!-- CLOCK -->
    <div class="clock-panel">
        <div class="clock" id="clock"><!-- DISPLAY_CLOCK --></div>
    </div>

    <!-- TABLE -->
    <div class="train-panel">
        <table class="train-table" id="table"><!-- DISPLAY_TRAINS --></table>
    </div>

</div>

</body>
</html>
